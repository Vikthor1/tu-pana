<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Pana — Start Here</title>
<style>
    :root {
        --bone:       #f7f4ec;
        --ink:        #221c13;
        --ink-soft:   #5c5344;
        --jade:       #2d7a5f;
        --jade-deep:  #1f5743;
        --jade-glow:  #e4efe7;
        --clay:       #b85c1a;
        --clay-glow:  #f6e8da;
        --card:       #fffdf7;
        --line:       #e3dccb;
        --radius: 16px;
        --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
        background: var(--bone);
        color: var(--ink);
        font: 400 17px/1.6 var(--font-body);
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* ── Header ── */
    header {
        width: 100%;
        max-width: 660px;
        padding: 28px 20px 10px;
        text-align: center;
    }
    .brand {
        font: 700 15px/1 var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--jade-deep);
    }
    h1 {
        font: 700 clamp(34px, 7vw, 52px)/1.12 var(--font-display);
        margin: 14px 0 6px;
        letter-spacing: -0.015em;
    }
    h1 em { font-style: italic; color: var(--jade); }
    .subtitle { color: var(--ink-soft); font-size: 16px; }

    /* ── Progress ── */
    .progress {
        position: sticky;
        top: 0;
        z-index: 5;
        width: 100%;
        max-width: 660px;
        padding: 10px 20px;
        background: linear-gradient(var(--bone) 78%, transparent);
    }
    .progress-track {
        height: 6px;
        border-radius: 3px;
        background: var(--line);
        overflow: hidden;
    }
    .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: var(--jade);
        transition: width 0.35s ease;
    }
    @media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
    .progress-label {
        margin-top: 5px;
        font: 600 11px/1 var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-soft);
        display: flex;
        justify-content: space-between;
    }

    /* ── Conversation ── */
    main {
        width: 100%;
        max-width: 660px;
        padding: 10px 20px 40px;
        flex: 1;
    }
    .msg {
        max-width: 86%;
        margin-bottom: 12px;
        padding: 13px 16px;
        border-radius: var(--radius);
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 4px solid var(--jade);
        box-shadow: 0 1px 2px rgba(34,28,19,0.05);
        animation: rise 0.3s ease both;
    }
    .msg strong { color: var(--jade-deep); }
    .msg .es { color: var(--ink-soft); font-style: italic; }
    .msg.me {
        margin-left: auto;
        border-left: 1px solid var(--line);
        border-right: 4px solid var(--clay);
        background: var(--clay-glow);
        font-weight: 600;
    }
    .msg.rule-card {
        max-width: 100%;
        border: 2px solid var(--jade);
        border-left-width: 2px;
        background: var(--jade-glow);
        padding: 18px;
    }
    .rule-card .rule-eyebrow {
        font: 700 11px/1 var(--font-mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--jade-deep);
        display: block;
        margin-bottom: 8px;
    }
    .rule-card .rule-big {
        font: 700 22px/1.3 var(--font-display);
        display: block;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }

    .typing {
        display: inline-flex;
        gap: 5px;
        padding: 14px 18px;
    }
    .typing i {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--jade);
        opacity: 0.4;
        animation: blink 1s infinite;
    }
    .typing i:nth-child(2) { animation-delay: 0.18s; }
    .typing i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: 0.6; } }

    /* ── Choice buttons ── */
    .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        justify-content: flex-end;
        margin: 6px 0 16px;
    }
    .choices button {
        min-height: 46px;
        padding: 11px 18px;
        border: 2px solid var(--clay);
        border-radius: 999px;
        background: var(--card);
        color: var(--clay);
        font: 700 15px/1.2 var(--font-body);
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
    }
    .choices button:hover { background: var(--clay); color: var(--card); }
    .choices button:focus-visible { outline: 3px solid var(--jade); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .choices button { transition: none; } }

    /* ── Route map (the 10 stages, 3 phases) ── */
    .route {
        max-width: 100%;
        padding: 16px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--card);
        margin-bottom: 12px;
    }
    .route-phase { margin-bottom: 12px; }
    .route-phase:last-child { margin-bottom: 0; }
    .route-phase-name {
        font: 700 12px/1 var(--font-mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--jade-deep);
        margin-bottom: 7px;
        display: block;
    }
    .route-stages { display: flex; flex-wrap: wrap; gap: 6px; }
    .route-stage {
        font: 600 13px/1.2 var(--font-body);
        padding: 6px 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--bone);
        color: var(--ink-soft);
    }
    .route-stage.gate {
        border: 2px solid var(--clay);
        color: var(--clay);
        font-weight: 700;
    }

    /* ── Sample essay line used in demos ── */
    .sample {
        font: 400 17px/1.65 var(--font-display);
        font-style: italic;
        padding: 14px 16px;
        border-left: 3px solid var(--clay);
        background: var(--card);
        border-radius: 0 var(--radius) var(--radius) 0;
    }

    /* ── Finale ── */
    .finale {
        max-width: 100%;
        text-align: center;
        padding: 26px 18px;
        border: 2px solid var(--jade);
        border-radius: var(--radius);
        background: var(--card);
    }
    .finale h2 { font: 700 26px/1.25 var(--font-display); margin-bottom: 6px; }
    .finale p { color: var(--ink-soft); margin-bottom: 18px; }
    .start-btn {
        display: inline-block;
        min-height: 52px;
        padding: 15px 30px;
        border-radius: 999px;
        border: none;
        background: var(--jade);
        color: #fff;
        font: 700 18px/1.2 var(--font-body);
        text-decoration: none;
        cursor: pointer;
    }
    .start-btn:hover { background: var(--jade-deep); }
    .start-btn:focus-visible { outline: 3px solid var(--clay); outline-offset: 3px; }
    .replay-btn {
        display: inline-block;
        margin-top: 12px;
        background: none;
        border: none;
        color: var(--ink-soft);
        font: 600 14px/1 var(--font-body);
        text-decoration: underline;
        cursor: pointer;
    }

    /* ── Skip ── */
    .skip-row {
        width: 100%;
        max-width: 660px;
        padding: 0 20px 30px;
        text-align: center;
    }
    .skip-row a {
        color: var(--ink-soft);
        font-size: 14px;
        text-decoration: underline;
    }
    .skip-row a:focus-visible { outline: 3px solid var(--jade); outline-offset: 2px; }
</style>
</head>
<body>

<header>
    <p class="brand">Tu Pana de Escritura</p>
    <h1>Before you write a word, <em>pana</em>…</h1>
    <p class="subtitle">Two minutes. Then the essay is all yours. · Dos minutos y arrancamos.</p>
</header>

<div class="progress" role="presentation">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressChapter">The deal</span><span id="progressCount"></span></div>
</div>

<main id="chat" aria-live="polite"></main>

<div class="skip-row">
    <a href="index.html?assignment=college-personal-statement" id="skipLink">I've done this before — skip to the app · Ya lo conozco</a>
</div>

<script>
(function () {
    'use strict';
    const APP_URL = 'index.html?assignment=college-personal-statement';
    const chat = document.getElementById('chat');
    const fill = document.getElementById('progressFill');
    const chapterLabel = document.getElementById('progressChapter');
    const countLabel = document.getElementById('progressCount');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ── The script: coach bubbles + your choices ─────────────────────────
    // step types:
    //   coach   {html}                 one bubble from Tu Pana
    //   block   {html}                 full-width card (rules, route map, samples)
    //   ask     {options:[{label, reply}]}          tap → your bubble + coach reply
    //   quiz    {options:[{label, right, reply}]}   myth-or-fact with feedback
    //   finale  {}                     closing card with the start button
    const SCRIPT = [
        { chapter: 'The deal' },
        { type: 'coach', html: 'Oye. I’m <strong>Tu Pana</strong> — your writing coach for this essay. Not your ghostwriter. There’s a difference, and it’s the whole point.' },
        { type: 'block', html: '<span class="rule-eyebrow">La regla de oro · The one rule</span><span class="rule-big">You write every word. I ask questions, point at what’s working, and flag what’s not. I will never write your essay — even if you ask nicely.</span>', cls: 'rule-card' },
        { type: 'coach', html: 'Why so strict? Because admissions readers see thousands of essays, and the generic AI ones all sound the same — smooth, empty, forgettable. The only unfair advantage you have is that <strong>nobody else has your life</strong>. My job is to keep that on the page.' },
        { type: 'ask', options: [
            { label: 'Fair. So what CAN you do?', reply: 'A lot. I read your draft like a smart, honest friend: I ask the question that unlocks a memory, tell you which sentence is carrying the essay, and which paragraph is hiding it. You decide what to do about it — every single time.' },
            { label: 'What if I get stuck?', reply: 'Then you tell me and we talk it out — that’s literally what I’m for. Getting stuck is part of writing, not a malfunction. What I won’t do is hand you sentences to paste. Struggle a little; the essay comes out sounding like you.' }
        ]},

        { chapter: 'Myth check' },
        { type: 'coach', html: 'Quick round — call each one <strong>myth or real</strong>. No grade, just vibes.' },
        { type: 'quiz', prompt: '“The move is: AI writes a draft, I just fix it up.”',
          options: [
            { label: 'Myth', right: true,  reply: '<strong>Myth</strong> — and not just here. An essay that starts as AI text stays hollow no matter how much you edit it, and readers can smell it. Here it’s also impossible: the deep tools stay locked until you’ve written your own first draft.' },
            { label: 'Real', right: false, reply: 'That’s the myth, pana. An essay that starts as AI text stays hollow no matter how much you edit, and readers can smell it. Here it’s also impossible: the deep tools stay locked until you’ve written your own first draft.' }
        ]},
        { type: 'quiz', prompt: '“If my family’s Spanish or my neighborhood shows up in my essay, that’s a weakness.”',
          options: [
            { label: 'Myth', right: true,  reply: '<strong>Myth — hard myth.</strong> The details only you can write — the Spanish your family actually speaks, the block you grew up on, the thing your mom says — that’s not a weakness, that’s the essay. I’m literally programmed to protect that from being polished away.' },
            { label: 'Real', right: false, reply: 'Other way around. The details only you can write — the Spanish your family actually speaks, the block you grew up on — that’s not a weakness, that’s the essay. I’m literally programmed to protect that from being polished away.' }
        ]},
        { type: 'quiz', prompt: '“Tu Pana can tell me my chances of getting in.”',
          options: [
            { label: 'Myth', right: true,  reply: '<strong>Myth.</strong> Nobody can — not me, not any AI, not that one guy on YouTube. I refuse to even guess, because chasing “what admissions wants to hear” is exactly how essays go generic. We’re chasing <em>true and specific</em> instead.' },
            { label: 'Real', right: false, reply: 'Nope — nobody can. Not me, not any AI, not that one guy on YouTube. I refuse to even guess, because chasing “what admissions wants to hear” is exactly how essays go generic. We’re chasing <em>true and specific</em> instead.' }
        ]},

        { chapter: 'The route' },
        { type: 'coach', html: 'Here’s the whole journey. Ten stages, three phases. You can see where you are the entire time.' },
        { type: 'block', html:
            '<div class="route-phase"><span class="route-phase-name">Start · 1–6</span><div class="route-stages">' +
            '<span class="route-stage">1 Memory</span><span class="route-stage">2 Connection</span><span class="route-stage">3 Pitch</span>' +
            '<span class="route-stage">4 Dig deeper</span><span class="route-stage">5 Outline</span><span class="route-stage gate">6 First draft — the lock 🔒</span></div></div>' +
            '<div class="route-phase"><span class="route-phase-name">Revise · 7–9</span><div class="route-stages">' +
            '<span class="route-stage">7 Revision</span><span class="route-stage">8 Voice polish</span><span class="route-stage">9 Checklist</span></div></div>' +
            '<div class="route-phase"><span class="route-phase-name">Finish · 10</span><div class="route-stages">' +
            '<span class="route-stage">10 Reflection + report</span></div></div>', cls: 'route' },
        { type: 'coach', html: 'Stage 6 is <strong>the lock</strong>: you write your first draft solo — no AI reading over your shoulder — and hit <em>Save</em>. That save is your proof of authorship, and it’s what unlocks the serious revision tools. Rough is fine. Rough is expected. First drafts are supposed to be a little embarrassing.' },
        { type: 'ask', options: [
            { label: 'What unlocks after the draft?', reply: 'Three levels of feedback. <strong>Passage coaching</strong>: select a few sentences in your draft and I read just that, closely. <strong>Full-draft review</strong>: I read everything through one lens you pick — structure, evidence, or voice. And the big one… the Council. More on that in a sec.' },
            { label: 'Does my work save?', reply: 'Automatically, in this browser on this device. Two rules: use the <strong>same browser on the same device</strong> every session, and don’t clear browsing data mid-project. There’s an export button if you want a backup file — worth doing when the draft gets good.' }
        ]},

        { chapter: 'You’re the boss' },
        { type: 'coach', html: 'Now the most important skill in the whole app. When I give you feedback, you never just obey it. Try it — here’s a line from a (fake) draft:' },
        { type: 'block', html: 'The summer I spent helping my uncle rebuild his car taught me a lot about responsibility and hard work.', cls: 'sample' },
        { type: 'coach', html: 'My note would be: <em>“‘Taught me a lot about responsibility and hard work’ is the summary every reader has seen a thousand times. What’s one specific moment from that garage — a sound, a mistake, an argument — that could show it instead?”</em><br><br>You’d have three moves. Pick one — there’s no wrong answer:' },
        { type: 'ask', options: [
            { label: '✅ Accept — rewrite with a real moment', reply: 'Solid. You’d swap the summary for the moment the jack slipped, or the first time the engine turned over. <strong>You</strong> write the new version — I never hand you the sentence.' },
            { label: '🔧 Adapt — take the idea, my way', reply: 'That’s the pro move honestly. Take the direction, ignore the framing, make it yours. Most good revision is adaptation, not obedience.' },
            { label: '❌ Reject — the line stays', reply: 'A power move — seriously. Sometimes I’m wrong, or the line matters for reasons I can’t see. It’s your essay. In the app, rejecting feedback is a recorded, respected decision — not a failure.' }
        ]},
        { type: 'coach', html: 'That’s the rhythm for every piece of feedback in the app: <strong>accept, adapt, or reject</strong> — and the app keeps score of your <em>decisions</em>, not your obedience. That decision log is actually evidence the essay is yours.' },

        { chapter: 'The Council' },
        { type: 'coach', html: 'When your draft is genuinely drafted — not perfect, just real — you can convene the <strong>Review Council</strong>: three readers go through your whole essay at once. <strong>Structure</strong> checks how it moves. <strong>Evidence</strong> checks if your moments are specific enough. <strong>Voice</strong> checks that it still sounds like you — and flags anything that’s drifting into generic “admissions-speak.”' },
        { type: 'coach', html: 'Then a synthesis boils it down: <strong>what’s working (protect it)</strong>, at most three things to fix first, and — when the readers disagree — the question comes to <em>you</em> to settle. Every point quotes your actual words as evidence. No scores. No predictions. Ever.' },
        { type: 'ask', options: [
            { label: 'When should I use it?', reply: 'After Stage 6, once you’ve got a full draft you’ve pushed as far as you can alone. Council first, then work the priorities one at a time with passage coaching. Don’t re-convene after every comma — revise for real, then check again.' },
            { label: 'Can it disagree with itself?', reply: 'Yes — and when the three readers genuinely split, I don’t fake a consensus. The disagreement comes to <em>you</em> as a question, because some calls only the writer can make. That’s a feature.' }
        ]},
        { type: 'coach', html: 'One thing you should know either way, because it matters: nothing is ever sent to the AI while you’re just writing. Your words leave this browser <strong>only when you explicitly ask</strong> — a chat message, a passage, a review — and the app tells you exactly what’s being sent before it goes. Nothing is stored on a server; your work lives here, on this device.' },

        { chapter: 'Ground rules' },
        { type: 'block', html: '<span class="rule-eyebrow">Cinco reglas · The five rules</span><span class="rule-big" style="font-size:17px; line-height:1.7; font-family:var(--font-body); font-weight:600;">1 — You write every word. The AI never does.<br>2 — Stage 6 first draft: solo, then save. That’s the key that unlocks everything.<br>3 — Accept, adapt, or reject every note. Rejecting is allowed and respected.<br>4 — Your Spanish, your Bronx, your weird specific details: those STAY.<br>5 — Same browser, same device, don’t clear data. Export a backup sometimes.</span>', cls: 'rule-card' },
        { type: 'finale' }
    ];

    // ── Engine ───────────────────────────────────────────────────────────
    const totalSteps = SCRIPT.filter(s => s.type).length;
    let done = 0;
    let index = 0;

    function bump() {
        done += 1;
        fill.style.width = Math.min(100, Math.round(done / totalSteps * 100)) + '%';
        countLabel.textContent = Math.min(done, totalSteps) + ' / ' + totalSteps;
    }

    function bubble(html, cls) {
        const div = document.createElement('div');
        div.className = 'msg' + (cls ? ' ' + cls : '');
        div.innerHTML = html;
        chat.appendChild(div);
        div.scrollIntoView({ block: 'end', behavior: reducedMotion ? 'auto' : 'smooth' });
        return div;
    }

    function withTyping(fn) {
        if (reducedMotion) { fn(); return; }
        const t = document.createElement('div');
        t.className = 'msg typing';
        t.setAttribute('aria-hidden', 'true');
        t.innerHTML = '<i></i><i></i><i></i>';
        chat.appendChild(t);
        t.scrollIntoView({ block: 'end', behavior: 'smooth' });
        setTimeout(() => { t.remove(); fn(); }, 620);
    }

    function offerChoices(options, isQuiz, prompt) {
        if (prompt) bubble(prompt);
        const row = document.createElement('div');
        row.className = 'choices';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = opt.label;
            btn.addEventListener('click', () => {
                row.remove();
                bubble(escapeText(opt.label), 'me');
                withTyping(() => {
                    bubble(opt.reply);
                    bump();
                    next();
                });
            });
            row.appendChild(btn);
        });
        chat.appendChild(row);
        row.scrollIntoView({ block: 'end', behavior: reducedMotion ? 'auto' : 'smooth' });
        row.querySelector('button').focus({ preventScroll: true });
    }

    function escapeText(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function finale() {
        const div = document.createElement('div');
        div.className = 'msg finale';
        div.innerHTML =
            '<h2>Ya estás listo. · You’re ready.</h2>' +
            '<p>Ten stages. Your words. One essay only you could write.</p>' +
            '<a class="start-btn" id="startBtn" href="' + APP_URL + '">Empecemos — Start my essay →</a><br>' +
            '<button type="button" class="replay-btn" id="replayBtn">Replay this intro · Repasar</button>';
        chat.appendChild(div);
        try { localStorage.setItem('tupana_tutorial_done', 'true'); } catch (e) {}
        document.getElementById('replayBtn').addEventListener('click', () => {
            chat.innerHTML = '';
            index = 0; done = 0;
            fill.style.width = '0%';
            next();
        });
        div.scrollIntoView({ block: 'end', behavior: reducedMotion ? 'auto' : 'smooth' });
        document.getElementById('startBtn').focus({ preventScroll: true });
        bump();
    }

    function next() {
        while (index < SCRIPT.length && SCRIPT[index].chapter) {
            chapterLabel.textContent = SCRIPT[index].chapter;
            index += 1;
        }
        if (index >= SCRIPT.length) return;
        const step = SCRIPT[index];
        index += 1;

        if (step.type === 'coach') {
            withTyping(() => { bubble(step.html); bump(); next(); });
        } else if (step.type === 'block') {
            bubble(step.html, step.cls || 'rule-card');
            bump();
            next();
        } else if (step.type === 'ask') {
            offerChoices(step.options, false);
        } else if (step.type === 'quiz') {
            offerChoices(step.options, true, step.prompt);
        } else if (step.type === 'finale') {
            finale();
        }
    }

    next();
})();
</script>
</body>
</html>
