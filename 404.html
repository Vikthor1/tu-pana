<!doctype html>
<html lang="es" data-theme="paper">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <title>Página no encontrada · Page not found</title>
    <!-- Self-contained by design: no stylesheet, script, font, or image dependency,
         so this page cannot itself 404. Cloudflare Pages serves it with a real 404
         status for any path the deployment does not contain. Without it, Pages falls
         back to index.html with HTTP 200, which makes an absent file indistinguishable
         from a served one. -->
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 2rem 1.25rem; box-sizing: border-box;
            background: #faf7f2; color: #2c2a26;
            font-family: Georgia, 'Times New Roman', serif; line-height: 1.6;
        }
        main { max-width: 32rem; }
        h1 { font-size: 1.5rem; margin: 0 0 .25rem; font-weight: 600; }
        .es { display: block; }
        .en { display: block; color: #5c574e; font-style: italic; font-size: 1.05rem; }
        p { margin: 1.25rem 0; }
        ul { list-style: none; padding: 0; margin: 1.5rem 0 0; }
        li { margin: .5rem 0; }
        a { color: #0b70c9; }
        a:focus-visible { outline: 3px solid #0b70c9; outline-offset: 2px; border-radius: 2px; }
    </style>
</head>
<body>
    <main>
        <h1>
            <span class="es">Página no encontrada</span>
            <span class="en" lang="en">Page not found</span>
        </h1>
        <p>
            Esta dirección no existe en este sitio.
            <span lang="en">This address does not exist on this site.</span>
        </p>
        <ul>
            <li><a href="studio.html">Tu Pana Writing Studio</a></li>
        </ul>
    </main>
</body>
</html>
